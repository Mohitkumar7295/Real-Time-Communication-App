spring:
  datasource:
    url: jdbc:h2:mem:meetapp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  allowed-origin: http://localhost:8080
  max-file-size-mb: 10
  max-room-participants: 5
  upload-dir: target/test-uploads
  otp-expiry-minutes: 5
  stun-urls: stun:stun.l.google.com:19302

spring:
  datasource:
    url: jdbc:h2:mem:meetapp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  allowed-origin: http://localhost:8080
  max-file-size-mb: 10
  max-room-participants: 5
  upload-dir: target/test-uploads
  otp-expiry-minutes: 5
  stun-urls: stun:stun.l.google.com:19302
  jwt-secret: test-dummy-jwt-secret-minimum-32-chars-long-abcdef
  jwt-expiry-minutes: 1440
  email-provider: log
  otp-pepper: default-otp-pepper-secret-value-32chars
  aes-key: k7x8V9uN1Z3pQ4yL6wE2mR0tS8vK5jH1bF4cO9aP3qE=
  chat-retention-days: 30
  file-retention-days: 7
  max-room-files: 20
  max-room-storage-mb: 50
  max-concurrent-file-ops: 4

spring:
  application:
    name: meetapp
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  allowed-origin: ${APP_ALLOWED_ORIGIN:http://localhost:8080}
  max-file-size-mb: ${MAX_FILE_SIZE_MB:10}
  max-room-participants: ${MAX_ROOM_PARTICIPANTS:5}
  upload-dir: ${UPLOAD_DIR:uploads}
  otp-expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  stun-urls: ${STUN_URLS:stun:stun.l.google.com:19302}
  turn-url: ${TURN_URL:}
  turn-username: ${TURN_USERNAME:}
  turn-credential: ${TURN_CREDENTIAL:}
  jwt-secret: ${JWT_SECRET:test-dummy-jwt-secret-minimum-32-chars-long-abcdef}
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}

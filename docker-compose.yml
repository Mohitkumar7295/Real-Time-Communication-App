version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meetapp-db
    environment:
      POSTGRES_DB: meetapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetapp-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/meetapp
      DB_USER: postgres
      DB_PASSWORD: password123
      JWT_SECRET: dev-dummy-jwt-secret-minimum-32-chars-long-abcdef
      OTP_PEPPER: dev-otp-pepper-secret-value-32chars
      AES_KEY: k7x8V9uN1Z3pQ4yL6wE2mR0tS8vK5jH1bF4cO9aP3qE=
      APP_ALLOWED_ORIGIN: http://localhost:8080
      EMAIL_PROVIDER: log
      UPLOAD_DIR: uploads
    volumes:
      - app_uploads:/app/uploads

volumes:
  postgres_data:
  app_uploads:

